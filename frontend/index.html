<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC PICK</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}.wrap{min-height:100svh;max-width:820px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.tag{font-size:11px;color:#9aa3b2;border:1px solid #252a34;padding:5px 8px;border-radius:999px}.hero{text-align:center;padding-top:8vh}h1{font-size:clamp(34px,8vw,62px);line-height:1.04;letter-spacing:-.045em;margin:0 0 24px}.cta{border:0;border-radius:999px;background:#fff;color:#0b0d12;min-height:48px;padding:0 22px;font-size:15px;font-weight:800}.panel{display:none;margin-top:26px;background:#121620;border:1px solid #252a34;border-radius:20px;padding:14px;text-align:left}.panel.show{display:block}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{height:42px;border-radius:11px;border:1px solid #2a303b;background:#0d1118;color:#c8d0dc;font-weight:800}.tab.active{background:#fff;color:#111}.mode{display:none}.mode.active{display:block}input{width:100%;min-height:50px;border-radius:13px;border:1px solid #2a303b;background:#0d1118;color:#fff;padding:12px 14px;font-size:15px;margin-top:8px}.go{width:100%;height:50px;margin-top:9px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:800}.status,.muted{font-size:12px;color:#9aa3b2;line-height:1.55;margin-top:10px}.result{margin-top:14px;background:#0d1118;border:1px solid #252a34;border-radius:14px;padding:14px;display:none}.result.show{display:block}.scorebox{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.score{padding:10px 5px;border:1px solid #252a34;border-radius:12px;text-align:center}.score strong{display:block;font-size:19px}.score span{font-size:10px;color:#8d97a6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.item{padding:10px;border:1px solid #252a34;border-radius:12px}.k{font-size:10px;color:#8d97a6}.v{font-size:13px;font-weight:700;margin-top:4px}.rank{margin:18px 0 40px;padding:16px;border:1px solid #252a34;border-radius:18px;background:#10141c;text-align:left}.rankhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.rank h2{font-size:18px;margin:0}.refresh{border:1px solid #303642;background:#151a23;color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #222833;align-items:center}.pos{font-size:20px;font-weight:900}.rtitle{font-size:13px;font-weight:750}.rmeta{font-size:11px;color:#929bab;margin-top:4px}.rscore{font-size:21px;font-weight:900;text-align:right}.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;border:1px solid #2b313d;border-radius:999px;padding:6px 9px;color:#c8d0dc}@media(max-width:600px){.grid{grid-template-columns:1fr}.scorebox{grid-template-columns:repeat(2,1fr)}.hero{padding-top:6vh}}</style></head><body><main class="wrap"><div class="top"><div class="logo">PC PICK</div><div class="tag">PRIVATE</div></div><section class="hero"><h1>이 PC,<br>살 만할까요?</h1><button class="cta" id="open">완본체 분석하기</button><div class="panel" id="panel"><div class="tabs"><button class="tab active" id="tabUrl">상품 링크</button><button class="tab" id="tabImg">사양 이미지</button></div><div class="mode active" id="modeUrl"><input id="url" placeholder="G마켓 · 11번가 · 하이마트 · 다나와 상품 링크"><button class="go" id="goUrl">링크 분석하기</button></div><div class="mode" id="modeImg"><input id="image" type="file" accept="image/*"><input id="shop" placeholder="구매처 (선택) 예: G마켓"><input id="price" inputmode="numeric" placeholder="현재 가격 (선택) 예: 1878230"><button class="go" id="goImg">이미지 읽고 분석하기</button><div class="muted">사양 이미지를 기기에서 OCR로 읽고 PC PICK이 부품 모델을 정리합니다. 가격까지 넣으면 가성비 점수와 순위도 계산합니다.</div></div><div class="status" id="status"></div><div class="result" id="result"></div></div></section><section class="rank"><div class="rankhead"><h2>완본체 종합 순위</h2><button class="refresh" id="refresh">새로고침</button></div><div class="muted">실제로 수집·분석된 상품만 표시합니다. 점수는 성능·부품 품질·가성비·정보 완성도를 합산합니다.</div><div class="sources"><span class="chip">G마켓</span><span class="chip">11번가</span><span class="chip">롯데하이마트</span><span class="chip">다나와</span></div><div id="ranklist" class="muted">순위를 불러오는 중...</div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String((s===null||s===undefined||s==='')?'확인 필요':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));$('open').onclick=()=>{$('panel').classList.add('show');$('url').focus()};function mode(w){let u=w==='url';$('tabUrl').classList.toggle('active',u);$('tabImg').classList.toggle('active',!u);$('modeUrl').classList.toggle('active',u);$('modeImg').classList.toggle('active',!u);$('status').textContent='';$('result').classList.remove('show')}$('tabUrl').onclick=()=>mode('url');$('tabImg').onclick=()=>mode('img');function render(d){let p=d.prices||{},c=d.components||{},s=d.scores||{},price=p.best||p.coupon||p.payment_conditional||p.list;let cells=[['구매처',d.shop],['유형',d.type],['CPU',c.CPU],['메인보드',c.MOTHERBOARD],['GPU',c.GPU],['RAM',c.RAM],['SSD',c.SSD],['쿨러',c.COOLER],['파워',c.PSU],['케이스',c.CASE],['OS',c.OS]];let scores=s.final!==undefined?'<div class="scorebox">'+[['종합',s.final],['성능',s.performance],['품질',s.quality],['가성비',s.value??'-'],['정보',s.completeness]].map(x=>'<div class="score"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('')+'</div>':'';$('result').innerHTML='<b>'+esc(d.title)+'</b>'+(price?'<div style="font-size:18px;font-weight:850;margin-top:8px">'+Number(price).toLocaleString()+'원</div>':'')+scores+'<div class="grid">'+cells.map(x=>'<div class="item"><div class="k">'+x[0]+'</div><div class="v">'+esc(x[1])+'</div></div>').join('')+'</div><div class="muted">'+esc(d.note)+'</div>';$('result').classList.add('show')}$('goUrl').onclick=async()=>{let u=$('url').value.trim();$('status').textContent='상품 페이지를 확인하고 있습니다...';try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail||'분석 실패');$('status').textContent=d.status==='OK'?'분석 완료':'확인 가능한 정보만 분석했습니다.';render(d);loadRanks()}catch(e){$('status').textContent=e.message}};$('goImg').onclick=async()=>{let f=$('image').files[0];if(!f){$('status').textContent='먼저 사양 이미지를 선택해 주세요.';return}if(!window.Tesseract){$('status').textContent='이미지 인식 모듈을 불러오지 못했습니다.';return}try{$('status').textContent='이미지 글자를 읽는 중입니다...';let o=await Tesseract.recognize(f,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent='이미지 읽는 중 '+Math.round((m.progress||0)*100)+'%'}});let text=o?.data?.text||'',pr=parseInt(($('price').value||'').replace(/[^0-9]/g,''))||null,shop=$('shop').value.trim()||null;$('status').textContent='부품 모델과 점수를 계산하고 있습니다...';let r=await fetch('/api/analyze-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ocr_text:text,price:pr,shop:shop})}),d=await r.json();if(!r.ok)throw Error(d.detail||'이미지 분석 실패');$('status').textContent=d.status==='OK'?'이미지 분석 완료':'일부 항목만 정확히 읽었습니다.';render(d);loadRanks()}catch(e){$('status').textContent=e.message||'이미지 분석에 실패했습니다.'}};async function loadRanks(){try{let r=await fetch('/api/rankings?limit=20'),d=await r.json();let a=d.items||[];if(!a.length){$('ranklist').innerHTML='<div class="muted">아직 검증된 순위 데이터가 없습니다. 사양 이미지와 가격을 분석하거나 쇼핑몰 데이터가 수집되면 자동으로 채워집니다.</div>';return}$('ranklist').innerHTML=a.map((x,i)=>'<div class="row"><div class="pos">'+(i+1)+'</div><div><div class="rtitle">'+esc(x.title)+'</div><div class="rmeta">'+esc(x.shop)+' · '+Number(x.price).toLocaleString()+'원 · 성능 '+x.scores.performance+' · 품질 '+x.scores.quality+(x.scores.value!==null?' · 가성비 '+x.scores.value:'')+'</div></div><div class="rscore">'+x.scores.final+'</div></div>').join('')}catch(e){$('ranklist').textContent='순위를 불러오지 못했습니다.'}}$('refresh').onclick=loadRanks;loadRanks();</script></body></html>
