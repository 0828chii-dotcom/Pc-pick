<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC PICK</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}.wrap{min-height:100svh;max-width:820px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.tag{font-size:11px;color:#9aa3b2;border:1px solid #252a34;padding:5px 8px;border-radius:999px}.hero{text-align:center;padding-top:8vh}h1{font-size:clamp(34px,8vw,62px);line-height:1.04;letter-spacing:-.045em;margin:0 0 24px}.cta{border:0;border-radius:999px;background:#fff;color:#0b0d12;min-height:48px;padding:0 22px;font-size:15px;font-weight:800}.panel,.rank{margin-top:24px;background:#121620;border:1px solid #252a34;border-radius:20px;padding:14px;text-align:left}.panel{display:none}.panel.show{display:block}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}.tab{height:42px;border-radius:11px;border:1px solid #2a303b;background:#0d1118;color:#c8d0dc;font-weight:800;font-size:12px}.tab.active{background:#fff;color:#111}.mode{display:none}.mode.active{display:block}input,textarea,select{width:100%;border-radius:13px;border:1px solid #2a303b;background:#0d1118;color:#fff;padding:12px 14px;font-size:14px}input,select{min-height:50px}textarea{min-height:130px;resize:vertical}.go{width:100%;height:50px;margin-top:9px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:800}.status,.muted{font-size:12px;color:#9aa3b2;line-height:1.55;margin-top:10px}.result{margin-top:14px;background:#0d1118;border:1px solid #252a34;border-radius:14px;padding:14px;display:none}.result.show{display:block}.score{font-size:34px;font-weight:900;letter-spacing:-.04em}.price{font-size:18px;font-weight:850;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.item{padding:10px;border:1px solid #252a34;border-radius:12px}.k{font-size:10px;color:#8d97a6}.v{font-size:13px;font-weight:700;margin-top:4px}.warn{margin-top:10px;padding:10px;border:1px solid #353b47;border-radius:11px;font-size:12px;line-height:1.5;color:#cbd2dd}.rank h2{font-size:18px;margin:0}.rankhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.refresh{border:1px solid #303744;background:#0d1118;color:#fff;border-radius:10px;padding:8px 11px;font-weight:700}.sources{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{font-size:11px;border:1px solid #2b313d;border-radius:999px;padding:6px 9px;color:#c8d0dc}.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #222934}.no{font-weight:900;font-size:16px}.rtitle{font-size:13px;font-weight:800}.rmeta{font-size:11px;color:#9aa3b2;margin-top:3px}.rscore{font-size:18px;font-weight:900;text-align:right}.progress{margin-top:9px;height:7px;background:#232a35;border-radius:99px;overflow:hidden}.bar{height:100%;background:#fff;width:0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:520px){.grid,.twocol{grid-template-columns:1fr}.hero{padding-top:7vh}.tabs{grid-template-columns:1fr 1fr 1fr}}</style></head><body><main class="wrap"><div class="top"><div class="logo">PC PICK</div><div class="tag">PRIVATE</div></div><section class="hero"><h1>이 PC,<br>살 만할까요?</h1><button class="cta" id="open">완본체 분석하기</button><div class="panel" id="panel"><div class="tabs"><button class="tab active" id="tabUrl">상품 링크</button><button class="tab" id="tabImg">사양 이미지</button><button class="tab" id="tabCollect">상품 수집</button></div><div class="mode active" id="modeUrl"><input id="url" inputmode="url" placeholder="G마켓 · 11번가 · 하이마트 · 다나와 링크"><button class="go" id="goUrl">링크 분석하기</button></div><div class="mode" id="modeImg"><input id="image" type="file" accept="image/*"><div class="twocol"><select id="shop"><option value="">구매처 선택(선택)</option><option>G마켓</option><option>11번가</option><option>롯데하이마트</option><option>다나와</option></select><input id="price" inputmode="numeric" placeholder="현재 가격(원, 선택)"></div><input id="sourceUrl" style="margin-top:8px" placeholder="상품 URL(선택)"><button class="go" id="goImg">이미지 읽고 분석하기</button><div class="muted">사양표 이미지를 OCR로 읽고, 확인된 부품만 점수에 반영합니다.</div></div><div class="mode" id="modeCollect"><textarea id="bulk" placeholder="상품 링크를 한 줄에 하나씩 붙여넣으세요.&#10;&#10;https://link.gmarket.co.kr/...&#10;https://www.11st.co.kr/...&#10;https://www.e-himart.co.kr/...&#10;https://prod.danawa.com/..."></textarea><button class="go" id="goCollect">목록 수집 · 점수 계산</button><div class="progress"><div class="bar" id="bar"></div></div><div class="muted">허용된 공개 상품 페이지만 읽습니다. 차단된 페이지는 우회하지 않고 이미지 분석 대상으로 남깁니다.</div></div><div class="status" id="status"></div><div class="result" id="result"></div></div></section><section class="rank"><div class="rankhead"><h2>완본체 통합 순위</h2><button class="refresh" id="refresh">새로고침</button></div><div class="sources"><span class="chip">G마켓</span><span class="chip">11번가</span><span class="chip">롯데하이마트</span><span class="chip">다나와</span></div><div class="muted">실제로 수집하거나 이미지에서 확인한 상품만 표시합니다. 가격 또는 사양이 확인되지 않은 상품은 임의로 채우지 않습니다.</div><div id="ranking"></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String((s===null||s===undefined||s==='')?'확인 필요':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));$('open').onclick=()=>{$('panel').classList.add('show');$('url').focus()};function mode(which){for(const x of ['Url','Img','Collect']){$('tab'+x).classList.toggle('active',which===x.toLowerCase());$('mode'+x).classList.toggle('active',which===x.toLowerCase())}$('status').textContent='';$('result').classList.remove('show')}$('tabUrl').onclick=()=>mode('url');$('tabImg').onclick=()=>mode('img');$('tabCollect').onclick=()=>mode('collect');function render(d){let p=d.prices||{},c=d.components||{},s=d.scores||{},price=p.best||p.coupon||p.payment_conditional||p.list;let cells=[['성능',s.performance],['부품 품질',s.quality],['가성비',s.value],['정보 완성도',s.completeness],['CPU',c.CPU],['메인보드',c.MOTHERBOARD],['GPU',c.GPU],['RAM',c.RAM],['SSD',c.SSD],['쿨러',c.COOLER],['파워',c.PSU],['케이스',c.CASE],['OS',c.OS]];$('result').innerHTML=(s.final!=null?'<div class="score">'+s.final+'점</div>':'')+'<b>'+esc(d.title)+'</b>'+(price?'<div class="price">'+Number(price).toLocaleString()+'원</div>':'')+'<div class="grid">'+cells.map(x=>'<div class="item"><div class="k">'+x[0]+'</div><div class="v">'+esc(x[1])+'</div></div>').join('')+'</div>'+(d.status!=='OK'?'<div class="warn">확실히 읽힌 정보만 표시합니다. 빠진 부품은 이미지 분석으로 보완할 수 있습니다.</div>':'')+'<div class="muted">'+esc(d.note)+'</div>';$('result').classList.add('show')}$('goUrl').onclick=async()=>{let u=$('url').value.trim();$('status').textContent='상품 페이지를 확인하고 있습니다...';$('result').classList.remove('show');try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail||'분석 실패');$('status').textContent=d.status==='OK'?'분석 완료':'일부 정보 확인 완료';render(d);loadRank()}catch(e){$('status').textContent=e.message}};$('goImg').onclick=async()=>{let f=$('image').files[0];if(!f){$('status').textContent='먼저 사양 이미지를 선택해 주세요.';return}try{$('status').textContent='이미지 글자를 읽는 중입니다...';let o=await Tesseract.recognize(f,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent='이미지 읽는 중 '+Math.round((m.progress||0)*100)+'%'}});let text=o.data?.text||'',price=Number(String($('price').value).replace(/[^0-9]/g,''))||null,shop=$('shop').value||null,source_url=$('sourceUrl').value.trim()||null;$('status').textContent='부품과 점수를 계산하고 있습니다...';let r=await fetch('/api/analyze-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ocr_text:text,price,shop,source_url})}),d=await r.json();if(!r.ok)throw Error(d.detail||'이미지 분석 실패');$('status').textContent='이미지 분석 완료';render(d);loadRank()}catch(e){$('status').textContent=e.message||'이미지 분석 실패'}};$('goCollect').onclick=async()=>{let lines=$('bulk').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length){$('status').textContent='수집할 링크를 넣어 주세요.';return}let ok=0,partial=0,fail=0;$('bar').style.width='0%';for(let i=0;i<lines.length;i++){ $('status').textContent=`수집 중 ${i+1}/${lines.length} · 성공 ${ok} · 일부 ${partial} · 실패 ${fail}`;try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:lines[i]})}),d=await r.json();if(!r.ok)throw Error();if(d.status==='OK')ok++;else partial++}catch(e){fail++}$('bar').style.width=Math.round((i+1)/lines.length*100)+'%'}$('status').textContent=`수집 완료 · 분석 ${ok} · 일부 ${partial} · 실패 ${fail}`;loadRank()};async function loadRank(){try{let r=await fetch('/api/rankings?limit=30'),d=await r.json(),box=$('ranking');if(!d.items?.length){box.innerHTML='<div class="muted" style="padding:18px 0">아직 점수화된 상품이 없습니다. 상품 링크나 사양 이미지를 수집하면 여기에 나타납니다.</div>';return}box.innerHTML=d.items.map((x,i)=>'<div class="row"><div class="no">'+(i+1)+'</div><div><div class="rtitle">'+esc(x.title)+'</div><div class="rmeta">'+esc(x.shop)+' · '+Number(x.price||0).toLocaleString()+'원 · '+esc(x.components?.CPU)+' · '+esc(x.components?.GPU)+'</div></div><div class="rscore">'+esc(x.scores?.final)+'<div class="k">PC PICK</div></div></div>').join('')}catch(e){$('ranking').innerHTML='<div class="muted">순위를 불러오지 못했습니다.</div>'}}$('refresh').onclick=loadRank;loadRank();</script></body></html>
