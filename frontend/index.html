<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC PICK</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}.wrap{min-height:100svh;max-width:700px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.tag{font-size:11px;color:#9aa3b2;border:1px solid #252a34;padding:5px 8px;border-radius:999px}.hero{text-align:center;padding-top:18vh}h1{font-size:clamp(34px,8vw,62px);line-height:1.04;letter-spacing:-.045em;margin:0 0 28px}.cta{border:0;border-radius:999px;background:#fff;color:#0b0d12;min-height:48px;padding:0 22px;font-size:15px;font-weight:800}.panel{display:none;margin-top:26px;background:#121620;border:1px solid #252a34;border-radius:20px;padding:14px;text-align:left}.panel.show{display:block}input{width:100%;height:52px;border-radius:13px;border:1px solid #2a303b;background:#0d1118;color:#fff;padding:0 14px;font-size:15px}.go{width:100%;height:50px;margin-top:9px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:800}.status,.muted{font-size:12px;color:#9aa3b2;line-height:1.55;margin-top:10px}.result{margin-top:14px;background:#0d1118;border:1px solid #252a34;border-radius:14px;padding:14px;display:none}.result.show{display:block}.price{font-size:18px;font-weight:850;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.item{padding:10px;border:1px solid #252a34;border-radius:12px}.k{font-size:10px;color:#8d97a6}.v{font-size:13px;font-weight:700;margin-top:4px}.warn{margin-top:10px;padding:10px;border:1px solid #353b47;border-radius:11px;font-size:12px;line-height:1.5;color:#cbd2dd}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="logo">PC PICK</div><div class="tag">PRIVATE</div></div><section class="hero"><h1>이 PC,<br>살 만할까요?</h1><button class="cta" id="open">완본체 비교하기</button><div class="panel" id="panel"><input id="url" inputmode="url" placeholder="G마켓 · 다나와 상품 링크 또는 공유 문구"><button class="go" id="go">분석하기</button><div class="muted">비밀번호로 보호된 개발 테스트입니다.</div><div class="status" id="status"></div><div class="result" id="result"></div></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String((s===null||s===undefined||s==='')?'확인 필요':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));$('open').onclick=()=>{$('panel').classList.add('show');$('url').focus()};$('go').onclick=async()=>{let u=$('url').value.trim();$('status').textContent='실제 상품 페이지를 확인하고 있습니다...';$('result').classList.remove('show');try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail||'분석 실패');$('status').textContent=d.status==='OK'?'분석 완료':d.status==='PARTIAL'?'일부 정보 확인 완료':'링크 인식 완료';let p=d.prices||{},c=d.components||{},price=p.coupon||p.payment_conditional||p.list;let cells=[['유형',d.type],['상품번호',d.product_code],['CPU',c.CPU],['GPU',c.GPU],['RAM',c.RAM],['SSD',c.SSD],['파워',c.PSU],['케이스',c.CASE]];$('result').innerHTML='<b>'+esc(d.title)+'</b><div class="price">'+(price?Number(price).toLocaleString()+'원':'가격 확인 필요')+'</div><div class="grid">'+cells.map(x=>'<div class="item"><div class="k">'+x[0]+'</div><div class="v">'+esc(x[1])+'</div></div>').join('')+'</div>'+(d.status!=='OK'?'<div class="warn">현재 쇼핑몰이 일부 정보를 자동으로 숨기거나 차단해서, 확인된 항목만 표시합니다.</div>':'')+'<div class="muted">'+esc(d.note)+'</div>';$('result').classList.add('show')}catch(e){$('status').textContent=e.message}};</script></body></html>
