<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC PICK</title><style>:root{font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#17191f}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e3e5eb;border-radius:18px;padding:18px;margin:12px 0}h1{margin:0 0 8px}input,button{min-height:50px;padding:12px 14px;border:1px solid #d7d9df;border-radius:12px;font-size:16px}input{width:100%}button{background:#111;color:#fff;font-weight:700}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}.muted{color:#6d7480;font-size:14px;line-height:1.5}.ok,.err,.info{padding:12px;margin-top:12px;border-radius:12px}.ok{background:#eef8ef}.err{background:#fff0f0}.info{background:#f1f4ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tier{font-size:30px;font-weight:800}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef0f4;font-size:12px}.drop{border:2px dashed #bbb;padding:14px;border-radius:14px;margin-top:12px}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:640px){.row,.grid{grid-template-columns:1fr}.row button{width:100%}}</style></head><body><main class="wrap"><div class="card"><h1>PC PICK</h1><p>완본체 분석 · 부품 등급 · 오늘 가격 · 불량/사고 이력</p><span class="badge">G마켓</span> <span class="badge">다나와</span><p class="muted">상품 상세 링크만 분석합니다. 문장·검색어·유튜브/블로그·알 수 없는 링크는 차단합니다.</p><div class="row"><input id="url" inputmode="url" autocomplete="off" placeholder="G마켓/다나와 상품 URL"><button id="btn" onclick="analyze()">분석하기</button></div><div class="drop"><input id="img" type="file" accept="image/*" onchange="imageAnalyze()"><p class="muted">상품 스펙표 스크린샷도 올릴 수 있습니다.</p></div><div id="status"></div></div><div id="result"></div><div class="card"><h2>부품 품질 등급</h2><p class="muted">같은 용량이라도 NAND·DRAM·컨트롤러·성능·내구성·보증·사고 이력을 모델별로 평가합니다.</p><div id="components" class="grid"></div></div></main><script>const $=x=>document.getElementById(x),hosts=new Set(['link.gmarket.co.kr','item.gmarket.co.kr','mitem.gmarket.co.kr','m.gmarket.co.kr','gmarket.co.kr','www.gmarket.co.kr','prod.danawa.com','m.danawa.com','danawa.com','www.danawa.com']);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,c='ok'){$('status').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function valid(s){if(!s||/\s/.test(s))return'상품 링크만 입력해 주세요.';try{let u=new URL(s);if(!['http:','https:'].includes(u.protocol)||!hosts.has(u.hostname.toLowerCase()))return'현재는 G마켓과 다나와 상품 링크만 분석합니다.'}catch{return'올바른 URL이 아닙니다.'}return''}async function analyze(){let u=$('url').value.trim(),e=valid(u);if(e)return msg(e,'err');$('btn').disabled=true;msg('상품 페이지 분석 중...','info');try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail||'분석 실패');$('result').innerHTML='<div class="card"><h2>'+esc(d.title)+'</h2><p>상품 유형: <b>'+esc(d.type)+'</b></p><p>관측 가격: <b>'+((d.prices||[]).map(x=>Number(x).toLocaleString()+'원').join(' / ')||'확인 필요')+'</b></p><p class="muted">'+esc(d.note)+'</p></div>';msg('분석 완료')}catch(e){msg(e.message,'err')}finally{$('btn').disabled=false}}async function imageAnalyze(){let f=$('img').files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>10*1024*1024)return msg('10MB 이하 이미지 파일만 사용해 주세요.','err');msg('이미지 분석 중...','info');let fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/analyze-image',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.detail||'이미지 분석 실패');$('result').innerHTML='<div class="card"><h2>이미지 분석</h2><p>유형: <b>'+esc(d.type)+'</b></p><pre>'+esc(d.ocr_text)+'</pre><p class="muted">'+esc(d.confidence_note)+'</p></div>';msg('이미지 분석 완료')}catch(e){msg(e.message,'err')}}async function load(){try{let r=await fetch('/api/components/SSD'),a=await r.json();$('components').innerHTML=a.map(x=>'<div class="card"><div class="tier">'+esc(x.tier)+'</div><b>'+esc(x.model_name)+'</b><p>'+esc(x.score)+'점</p></div>').join('')}catch{}}load()</script></body></html>
