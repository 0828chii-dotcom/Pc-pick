<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC PICK</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif}.wrap{min-height:100svh;max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.tag{font-size:11px;color:#9aa3b2;border:1px solid #252a34;padding:5px 8px;border-radius:999px}.hero{text-align:center;padding-top:11vh}h1{font-size:clamp(34px,8vw,62px);line-height:1.04;letter-spacing:-.045em;margin:0 0 24px}.cta{border:0;border-radius:999px;background:#fff;color:#0b0d12;min-height:48px;padding:0 22px;font-size:15px;font-weight:800}.panel{display:none;margin-top:26px;background:#121620;border:1px solid #252a34;border-radius:20px;padding:14px;text-align:left}.panel.show{display:block}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{height:42px;border-radius:11px;border:1px solid #2a303b;background:#0d1118;color:#c8d0dc;font-weight:800}.tab.active{background:#fff;color:#111}.mode{display:none}.mode.active{display:block}input[type=text],input[type=url],input[type=file]{width:100%;min-height:52px;border-radius:13px;border:1px solid #2a303b;background:#0d1118;color:#fff;padding:12px 14px;font-size:15px}.go{width:100%;height:50px;margin-top:9px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:800}.status,.muted{font-size:12px;color:#9aa3b2;line-height:1.55;margin-top:10px}.result{margin-top:14px;background:#0d1118;border:1px solid #252a34;border-radius:14px;padding:14px;display:none}.result.show{display:block}.price{font-size:18px;font-weight:850;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.item{padding:10px;border:1px solid #252a34;border-radius:12px}.k{font-size:10px;color:#8d97a6}.v{font-size:13px;font-weight:700;margin-top:4px}.warn{margin-top:10px;padding:10px;border:1px solid #353b47;border-radius:11px;font-size:12px;line-height:1.5;color:#cbd2dd}.rank{margin:18px 0 40px;padding:16px;border:1px solid #252a34;border-radius:18px;background:#10141c;text-align:left}.rank h2{font-size:18px;margin:0 0 8px}.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;border:1px solid #2b313d;border-radius:999px;padding:6px 9px;color:#c8d0dc}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:8vh}}</style></head><body><main class="wrap"><div class="top"><div class="logo">PC PICK</div><div class="tag">PRIVATE</div></div><section class="hero"><h1>이 PC,<br>살 만할까요?</h1><button class="cta" id="open">완본체 분석하기</button><div class="panel" id="panel"><div class="tabs"><button class="tab active" id="tabUrl">상품 링크</button><button class="tab" id="tabImg">사양 이미지</button></div><div class="mode active" id="modeUrl"><input id="url" inputmode="url" placeholder="G마켓 · 다나와 상품 링크 또는 공유 문구"><button class="go" id="goUrl">링크 분석하기</button></div><div class="mode" id="modeImg"><input id="image" type="file" accept="image/*"><button class="go" id="goImg">이미지 읽고 분석하기</button><div class="muted">사양표가 선명하게 보이는 이미지를 올려 주세요. 이미지의 글자를 기기에서 읽은 뒤 PC PICK이 부품명으로 정리합니다.</div></div><div class="status" id="status"></div><div class="result" id="result"></div></div></section><section class="rank"><h2>완본체 실시간 순위</h2><div class="muted">가격·부품 품질·성능·조건부 할인까지 합쳐 점수화하는 순위 영역입니다. 실제 데이터 연동 전에는 임의 순위를 표시하지 않습니다.</div><div class="sources"><span class="chip">G마켓</span><span class="chip">롯데하이마트</span><span class="chip">11번가</span></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String((s===null||s===undefined||s==='')?'확인 필요':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));$('open').onclick=()=>{$('panel').classList.add('show');$('url').focus()};function mode(which){let u=which==='url';$('tabUrl').classList.toggle('active',u);$('tabImg').classList.toggle('active',!u);$('modeUrl').classList.toggle('active',u);$('modeImg').classList.toggle('active',!u);$('status').textContent='';$('result').classList.remove('show')}$('tabUrl').onclick=()=>mode('url');$('tabImg').onclick=()=>mode('img');function render(d){let p=d.prices||{},c=d.components||{},price=p.coupon||p.payment_conditional||p.list;let cells=[['유형',d.type],['상품번호',d.product_code],['CPU',c.CPU],['메인보드',c.MOTHERBOARD],['GPU',c.GPU],['RAM',c.RAM],['SSD',c.SSD],['쿨러',c.COOLER],['파워',c.PSU],['케이스',c.CASE],['OS',c.OS]];$('result').innerHTML='<b>'+esc(d.title)+'</b>'+(price?'<div class="price">'+Number(price).toLocaleString()+'원</div>':'')+'<div class="grid">'+cells.map(x=>'<div class="item"><div class="k">'+x[0]+'</div><div class="v">'+esc(x[1])+'</div></div>').join('')+'</div>'+(d.status!=='OK'?'<div class="warn">확실히 읽힌 정보만 표시합니다. 인식하지 못한 항목은 임의로 추정하지 않습니다.</div>':'')+'<div class="muted">'+esc(d.note)+'</div>';$('result').classList.add('show')}$('goUrl').onclick=async()=>{let u=$('url').value.trim();$('status').textContent='실제 상품 페이지를 확인하고 있습니다...';$('result').classList.remove('show');try{let r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail||'분석 실패');$('status').textContent=d.status==='OK'?'분석 완료':d.status==='PARTIAL'?'일부 정보 확인 완료':'링크 인식 완료';render(d)}catch(e){$('status').textContent=e.message}};$('goImg').onclick=async()=>{let f=$('image').files[0];if(!f){$('status').textContent='먼저 사양 이미지를 선택해 주세요.';return}$('result').classList.remove('show');if(!window.Tesseract){$('status').textContent='이미지 인식 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';return}try{$('status').textContent='이미지 글자를 읽는 중입니다...';let o=await Tesseract.recognize(f,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent='이미지 읽는 중 '+Math.round((m.progress||0)*100)+'%'}});let text=(o.data&&o.data.text)||'';$('status').textContent='부품 모델명을 정리하고 있습니다...';let r=await fetch('/api/analyze-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ocr_text:text})}),d=await r.json();if(!r.ok)throw Error(d.detail||'이미지 분석 실패');$('status').textContent=d.status==='OK'?'이미지 분석 완료':'이미지에서 일부 정보 확인 완료';render(d)}catch(e){$('status').textContent=e.message||'이미지 분석에 실패했습니다.'}};</script></body></html>
